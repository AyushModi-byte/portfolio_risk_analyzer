# Continuous integration. Runs on every push and pull request.
# Uses no secrets and no network: tests run offline against the bundled price snapshot and a
# scripted fake LLM.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .
      - name: Tests with coverage
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term
      - name: Coverage gate (app/analytics at least 80%)
        working-directory: backend
        run: coverage report --include="app/analytics/*" --fail-under=80
      - name: Offline agent eval (fake LLM)
        run: python scripts/run_agent_eval.py --fake-llm

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build
        run: npm run build
        env:
          # The build does not call the API; this only has to be set for the app to start.
          VITE_API_URL: https://api.example.invalid
