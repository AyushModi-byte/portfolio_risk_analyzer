# Deploys backend/ to a Hugging Face Space (Docker SDK) after CI passes on main.
#
# FIRST-TIME SETUP (once; the full checklist is in docs/SETUP_AND_DEPLOYMENT.md)
#   1. Hugging Face: create a Space, SDK "Docker", blank template. The Space repo starts with
#      a README; this workflow replaces its contents on every deploy (force-push), so do not
#      keep anything in the Space repo that is not in this GitHub repo.
#   2. Hugging Face: Settings > Access Tokens > new token with WRITE access.
#   3. GitHub: Settings > Secrets and variables > Actions > Secrets:
#        HF_TOKEN  the token from step 2
#        HF_SPACE  username/space-name  (for example ayush/portfolio-risk-api)
#   4. Hugging Face Space > Settings > Secrets: GEMINI_API_KEY (optional) and
#      Variables: ALLOWED_ORIGINS (your Vercel URL plus http://localhost:5173, comma separated).
#      Runtime configuration lives on the Space, never in this repo.
#   5. Push to main (or run this workflow by hand from the Actions tab). The Space builds
#      the image; watch the "Logs" tab of the Space for the build.
#
# What it does: takes the committed files of backend/, sets the Space README to
# backend/SPACE_README.md (front matter: sdk docker, app_port 7860), stamps the commit hash
# into the Dockerfile so /health reports it, and force-pushes the result to the Space.
name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual run; deploys the current main without waiting for CI

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Push to Hugging Face Space
    runs-on: ubuntu-latest
    # Only after a successful CI run for a push to main (not for pull requests), or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ secrets.HF_SPACE }}
      # The commit CI validated (for workflow_dispatch, the commit the run was started on).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN and HF_SPACE secrets (see the comments at the top of this file)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Assemble the Space contents
        run: |
          mkdir space
          # Committed files only: no venv, caches or local .env can leak into the Space.
          git archive "$DEPLOY_SHA" backend | tar -x -C space --strip-components=1
          rm -rf space/tests
          mv space/SPACE_README.md space/README.md
          sed -i "s/^ARG GIT_SHA=.*/ARG GIT_SHA=${DEPLOY_SHA::7}/" space/Dockerfile
          grep -n '^ARG GIT_SHA' space/Dockerfile
      - name: Push to the Space
        working-directory: space
        run: |
          git init --initial-branch=main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit --message "Deploy ${DEPLOY_SHA}"
          # HF_TOKEN is a secret, so GitHub masks it in the logs.
          git push --force "https://hf-user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
